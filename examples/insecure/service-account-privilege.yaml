# Deliberately INSECURE service account wiring, for demonstrating the
# cross-resource correlation (KS-RBAC-006).
#
# The Deployment below is otherwise exemplary: non-root, read-only rootfs, all
# capabilities dropped, seccomp on, digest-pinned image, probes and limits set.
# Every per-resource workload rule passes it. It is still a cluster takeover,
# because it mounts a ServiceAccount token for an identity bound to
# cluster-admin — which is a fact about three objects, not about any one of
# them. That is the finding no single-resource rule can produce.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-runner-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ci-runner
    namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-runner
  template:
    metadata:
      labels:
        app: ci-runner
    spec:
      serviceAccountName: ci-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ci-runner:1.4.2@sha256:1f2d3c4b5a69788091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708
          ports:
            - containerPort: 8080
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
