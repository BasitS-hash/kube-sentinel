# The same ci-runner workload as examples/insecure/service-account-privilege.yaml,
# wired up properly. Should produce zero kube-sentinel findings.
#
# Two independent things keep it clean, and both are worth having:
#   - the ServiceAccount is bound to a Role that can read one named ConfigMap,
#     so even a leaked token is worth almost nothing (KS-RBAC-006);
#   - the token is not mounted at all, since this workload does not call the
#     Kubernetes API (KS-WL-013).
# Drop the automount lines and KS-WL-013 reports the mount at MEDIUM, but
# KS-RBAC-006 stays silent — that is the whole point of the correlation: a
# mounted token is only critical when the identity behind it is powerful.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner
  namespace: demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-runner-reader
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ci-runner-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-runner-reader-binding
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-runner-reader
subjects:
  - kind: ServiceAccount
    name: ci-runner
    namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-runner
  template:
    metadata:
      labels:
        app: ci-runner
    spec:
      serviceAccountName: ci-runner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ci-runner:1.4.2@sha256:1f2d3c4b5a69788091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708
          ports:
            - containerPort: 8080
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
